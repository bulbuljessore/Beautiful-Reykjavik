<div style="height:90px;"></div>
<header style="position:fixed;top:0;left:0;right:0;z-index:60;padding:16px 24px 0;font-family:'Karla',sans-serif;">

<span onClick="{{ toggleMenu }}" style="display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 14px;border-radius:999px;border:1px solid #3A4E6A;color:#C4CCD8;cursor:pointer;transition:border-color 160ms ease,transform 160ms cubic-bezier(0.23,1,0.32,1);" style-hover="border-color:#C29A4C;" style-active="transform:scale(0.96);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg><span style="width:30px;height:30px;border-radius:50%;background:{{ avatarBg }};color:#0E1B2C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;"><sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">{{ initial }}</sc-if><sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F3EEE4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></sc-if></span></span>
<a href="apartments.html" style="animation:brGlow 2.6s ease-in-out infinite;background:#C29A4C;color:#0E1B2C;padding:11px 22px;border-radius:999px;font-weight:700;font-size:15px;transition:background 160ms ease,transform 160ms cubic-bezier(0.23,1,0.32,1);" style-hover="background:#D4AE62;color:#0E1B2C;" style-active="transform:scale(0.96);">Book now</a>
</div>
<span data-m-only="1" onClick="{{ toggleMobile }}" aria-label="Menu" style="width:44px;height:44px;border-radius:50%;border:1px solid #3A4E6A;align-items:center;justify-content:center;color:#C4CCD8;cursor:pointer;transition:border-color 160ms ease,color 160ms ease,transform 160ms cubic-bezier(0.23,1,0.32,1);" style-hover="border-color:#C29A4C;color:#C29A4C;" style-active="transform:scale(0.94);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="8" y2="8"></line><line x1="4" x2="20" y1="16" y2="16"></line></svg></span>
<sc-if value="{{ showMobile }}" hint-placeholder-val="{{ false }}"><div style="animation:popIn 180ms cubic-bezier(0.23,1,0.32,1);transform-origin:top right;position:absolute;left:0;right:0;top:68px;background:#1A2B42;border:1px solid #2A3D57;border-radius:24px;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,0.45);display:flex;flex-direction:column;"><sc-for list="{{ links }}" as="n" hint-placeholder-count="6"><a href="{{ n.href }}" style="font-family:'Figtree','Karla',sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:22px;padding:14px 16px;border-radius:16px;color:{{ n.fg }};background:{{ n.bg }};" style-hover="color:#D4AE62;">{{ n.label }}</a></sc-for></div></sc-if>
<sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
<div style="animation:popIn 180ms cubic-bezier(0.23,1,0.32,1);transform-origin:top right;position:absolute;right:8px;top:72px;width:290px;background:#FFFFFF;color:#0E1B2C;border-radius:20px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,0.35);display:flex;flex-direction:column;">
<sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
<a href="account.html#overview" style="color:#0E1B2C;display:flex;gap:12px;align-items:center;padding:14px 14px 16px;border-bottom:1px solid #ECE6DA;margin-bottom:6px;border-radius:12px 12px 0 0;" style-hover="background:#F5F1EA;color:#0E1B2C;"><span style="width:42px;height:42px;border-radius:50%;background:#C29A4C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;">{{ initial }}</span><div style="display:flex;flex-direction:column;min-width:0;"><span style="font-weight:700;font-size:16px;">{{ userName }}</span><span style="font-size:13px;color:#6B7280;overflow:hidden;text-overflow:ellipsis;">{{ userEmail }}</span></div></a>

<div style="height:1px;background:#ECE6DA;margin:6px 0;"></div>
<div onClick="{{ logout }}" style="display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;color:#2A3445;" style-hover="background:#F5F1EA;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg><span>Log out</span></div>
</sc-if>
<sc-if value="{{ loggedOut }}" hint-placeholder-val="{{ true }}">
<a href="login.html#signup" style="color:#0E1B2C;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:700;" style-hover="background:#F5F1EA;color:#0E1B2C;">Sign up</a>
<a href="login.html#login" style="color:#0E1B2C;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:500;" style-hover="background:#F5F1EA;color:#0E1B2C;">Log in</a>
<div style="height:1px;background:#ECE6DA;margin:6px 0;"></div>
<a href="login.html#login" style="color:#2A3445;display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;font-size:15px;font-weight:500;" style-hover="background:#F5F1EA;color:#2A3445;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg><span>Manage a booking</span></a>
<a href="about.html" style="color:#2A3445;display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;font-size:15px;font-weight:500;" style-hover="background:#F5F1EA;color:#2A3445;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg><span>Help, 24 hours a day</span></a>
</sc-if>

<a href="account.html#saved" style="display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;font-size:12px;font-weight:700;color:#C4CCD8;transition:color 160ms ease;" style-hover="color:#D4AE62;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.25c-.3 0-.6-.1-.84-.28C8.4 17.9 3 13.7 3 8.9 3 6.2 5.1 4 7.7 4c1.7 0 3.2.9 4.3 2.3C13.1 4.9 14.6 4 16.3 4 18.9 4 21 6.2 21 8.9c0 4.8-5.4 9-8.16 11.07-.24.18-.54.28-.84.28Z"></path></svg>Saved</a>
<a href="apartments.html" style="animation:brGlow 2.6s ease-in-out infinite;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:#C29A4C;color:#0E1B2C;font-size:16px;font-weight:700;transition:background 160ms ease,transform 160ms cubic-bezier(0.23,1,0.32,1);" style-hover="background:#D4AE62;color:#0E1B2C;" style-active="transform:scale(0.97);">Book now</a>

</div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menu: false, mobile: false, user: null };
  componentDidMount() {
    this.read = () => { try { this.setState({ user: JSON.parse(localStorage.getItem('br_user') || 'null') }); } catch (e) {} };
    this.read(); window.addEventListener('storage', this.read);
    this.cl = e => { if ((this.state.menu || this.state.mobile) && !e.target.closest('header')) this.setState({ menu: false, mobile: false }); };
    document.addEventListener('click', this.cl);
    if ('IntersectionObserver' in window) { this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.setAttribute('data-iv', '1'); this.io.unobserve(e.target); } }), { rootMargin: '0px 0px -30px 0px' }); const scan = () => document.querySelectorAll('svg[stroke="currentColor"]:not([data-io])').forEach(s => { s.setAttribute('data-io', '1'); this.io.observe(s); }); scan(); this.mo = new MutationObserver(() => { clearTimeout(this.mt); this.mt = setTimeout(scan, 60); }); this.mo.observe(document.body, { childList: true, subtree: true }); }
    if (!/(index\.html|\/)$/.test(location.pathname) && !window.__lenis && matchMedia('(pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) { const sc = document.createElement('script'); sc.src = 'https://unpkg.com/lenis@1.1.18/dist/lenis.min.js'; sc.onload = () => { try { const l = new Lenis({ lerp: 0.1 }); window.__lenis = l; const raf = t => { l.raf(t); requestAnimationFrame(raf); }; requestAnimationFrame(raf); } catch (e) {} }; document.head.appendChild(sc); }
  }
  componentWillUnmount() { window.removeEventListener('storage', this.read); document.removeEventListener('click', this.cl); }
  renderVals() {
    const s = this.state, act = this.props.active || '';
    const L = [['Apartments', 'apartments.html', 'apartments'], ['Reviews', 'reviews.html', 'reviews'], ['Your host', 'host.html', 'host'], ['Neighbourhood', 'neighbourhood.html', 'neighbourhood', 1], ['Seasons', 'seasons.html', 'seasons', 1], ['About', 'about.html', 'about', 1]];
    const I = { trips: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>', saved: '<path d="M12 20.25c-.3 0-.6-.1-.84-.28C8.4 17.9 3 13.7 3 8.9 3 6.2 5.1 4 7.7 4c1.7 0 3.2.9 4.3 2.3C13.1 4.9 14.6 4 16.3 4 18.9 4 21 6.2 21 8.9c0 4.8-5.4 9-8.16 11.07-.24.18-.54.28-.84.28Z"/>', pay: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>', user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>' };
    const u = s.user;
    return {
      links: L.map(([label, href, k, low]) => ({ label, href, low: low ? '1' : undefined, fg: act === k ? '#C29A4C' : '#C4CCD8', bg: act === k ? 'rgba(194,154,76,0.14)' : 'transparent' })),
      showMobile: s.mobile, toggleMobile: e => { if (e) e.stopPropagation(); this.setState({ mobile: !s.mobile, menu: false }); }, acctHref: u ? 'account.html#overview' : 'login.html#login', acctLabel: u ? 'Account' : 'Log in',
      toggleMenu: e => { if (e) e.stopPropagation(); this.setState({ menu: !s.menu }); }, showMenu: s.menu,
      loggedIn: !!u, loggedOut: !u, avatarBg: u ? '#C29A4C' : '#4A5566', initial: u ? u.name[0].toUpperCase() : '', userName: u ? u.name : '', userEmail: u ? u.email : '',
      acctItems: [['My trips', 'account.html#trips', 'trips'], ['Saved apartments', 'account.html#saved', 'saved'], ['Payment methods', 'account.html#payments', 'pay'], ['Personal info', 'account.html#personal', 'user']].map(([label, href, k]) => ({ label, href, svg: { __html: I[k] } })),
      logout: () => { localStorage.removeItem('br_user'); this.setState({ user: null, menu: false }); if (/account\.html/.test(location.pathname)) location.href = 'index.html'; },
    };
  }
}
</script>
