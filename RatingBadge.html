<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>@font-face{font-family:'Karla';src:url('fonts/Karla-Variable.ttf') format('truetype');font-weight:200 800;font-display:swap}</style>
</helmet>
<div style="font-family:'Karla',sans-serif;color:{{ fg }};">
<sc-if value="{{ isHero }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;">
<div style="display:flex;align-items:center;justify-content:center;">
<img src="assets/badges/laurel-right.png" alt="" style="height:clamp(76px,8vw,104px);width:auto;margin-right:-4px;translate:0 18%;filter:drop-shadow(0 8px 10px rgba(0,0,0,0.25));">
<span style="font-family:'Figtree','Karla',sans-serif;font-weight:600;letter-spacing:-0.04em;font-size:clamp(56px,7vw,88px);line-height:1;padding:0 4px;">{{ rating }}</span>
<img src="assets/badges/laurel-left.png" alt="" style="height:clamp(76px,8vw,104px);width:auto;margin-left:-4px;translate:0 18%;filter:drop-shadow(0 8px 10px rgba(0,0,0,0.25));">
</div>
<span style="font-family:'Figtree','Karla',sans-serif;font-weight:600;letter-spacing:-0.02em;font-size:20px;">{{ label }}</span>
<span style="font-size:14px;line-height:1.5;color:{{ muted }};max-width:320px;text-wrap:balance;">{{ sub }}</span>
</div>
</sc-if>
<sc-if value="{{ isBand }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;background:{{ bandBg }};border:1px solid {{ bandBd }};border-radius:18px;padding:10px 20px 10px 14px;">
<div style="display:flex;align-items:center;flex:none;">
<img src="assets/badges/laurel-right.png" alt="" style="height:44px;width:auto;translate:0 10%;">
<span style="display:flex;flex-direction:column;align-items:center;font-family:'Figtree','Karla',sans-serif;font-weight:700;letter-spacing:-0.01em;font-size:15px;line-height:1.05;padding:0 1px;"><span>{{ label1 }}</span><span>{{ label2 }}</span></span>
<img src="assets/badges/laurel-left.png" alt="" style="height:44px;width:auto;translate:0 10%;">
</div>
<span style="flex:1 1 200px;font-size:14px;line-height:1.45;color:{{ muted }};">{{ sub }}</span>
<div style="display:flex;align-items:center;gap:14px;flex:none;">
<div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-family:'Figtree','Karla',sans-serif;font-weight:700;font-size:20px;line-height:1;">{{ rating }}</span><span style="display:flex;gap:1px;color:#C29A4C;"><sc-for list="{{ stars }}" as="s" hint-placeholder-count="5"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></sc-for></span></div>
<span style="width:1px;height:32px;background:{{ bandBd }};"></span>
<div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span style="font-family:'Figtree','Karla',sans-serif;font-weight:700;font-size:20px;line-height:1;">{{ count }}</span><span style="font-size:12px;color:{{ muted }};">reviews</span></div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hero&quot;,&quot;band&quot;],&quot;default&quot;:&quot;band&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4.95&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Guest favorite&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;One of the most loved homes, according to guests&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9,793&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, dark = p.dark !== false && p.dark !== 'false', label = p.label || 'Guest favorite';
    const parts = label.split(' '), l1 = parts.length > 1 ? parts[0] : label, l2 = parts.length > 1 ? parts.slice(1).join(' ') : '';
    return {
      isHero: p.variant === 'hero', isBand: p.variant !== 'hero', label, label1: l1, label2: l2,
      rating: p.rating || '4.95', sub: p.sub || 'One of the most loved homes, according to guests', count: p.count || '9,793', stars: [1, 2, 3, 4, 5],
      fg: dark ? '#F3EEE4' : '#0E1B2C', muted: dark ? '#C4CCD8' : '#4A5566', bandBg: dark ? '#1A2B42' : '#F3EEE4', bandBd: dark ? '#2A3D57' : '#D4CCBD',
    };
  }
}
</script>
</body>
</html>
